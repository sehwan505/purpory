[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purpory-hermes"
version = "0.1.0"
description = "Purpory memory provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.entry-points."hermes_agent.memory_providers"]
purpory = "purpory_hermes:register"

[tool.setuptools]
packages = ["purpory_hermes"]
