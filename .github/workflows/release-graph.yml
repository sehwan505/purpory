name: Release graph asset

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to upload release assets

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install purpory
        run: uv sync --frozen

      - name: Build graph of purpory source (AST-only, no API cost)
        # purpory/skills/ contains 126+ .md files that trigger the LLM pass.
        # Temporarily ignore all .md files so extraction stays pure AST (no API key needed).
        run: |
          echo "*.md" >> .purporyignore
          echo "*.txt" >> .purporyignore
          uv run --frozen purpory extract purpory/
          git checkout .purporyignore 2>/dev/null || rm -f .purporyignore

      - name: Cluster and label communities
        run: uv run --frozen purpory cluster-only purpory/ --no-label

      - name: Export release artifacts
        run: |
          mkdir -p dist-graph
          uv run --frozen purpory export json --root purpory/ --output dist-graph/graph.json
          uv run --frozen purpory export report --root purpory/ --output dist-graph/GRAPH_REPORT.md
          uv run --frozen purpory export html --graph dist-graph/graph.json

      - name: Bundle release asset
        run: |
          tar -czf purpory-self-graph.tar.gz -C dist-graph .
          echo "Asset contents:"
          tar -tzf purpory-self-graph.tar.gz

      - name: Upload to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: purpory-self-graph.tar.gz

      - name: Upload as workflow artifact (for workflow_dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: purpory-self-graph
          path: purpory-self-graph.tar.gz
          retention-days: 7
