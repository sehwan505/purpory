name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/cli ./internal/launch
      - run: go build ./cmd/purpory
      - name: Test local CLI installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          install_root=$(mktemp -d)
          PURPORY_BIN_DIR="$install_root/bin" ./install.sh cli --local
          "$install_root/bin/purpory" version
          PURPORY_BIN_DIR="$install_root/bin" ./install.sh cli --uninstall
          test ! -e "$install_root/bin/purpory"
      - name: Test local CLI installer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PURPORY_BIN_DIR = Join-Path $env:RUNNER_TEMP "purpory-bin"
          ./install.ps1 -Component cli -Local
          & "$env:PURPORY_BIN_DIR/purpory.exe" version
          ./install.ps1 -Component cli -Uninstall
          if (Test-Path "$env:PURPORY_BIN_DIR/purpory.exe") { throw "CLI uninstall failed" }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build application
        if: runner.os != 'Linux'
        run: wails build -clean
      - name: Build application on Linux
        if: runner.os == 'Linux'
        run: wails build -clean -tags webkit2_41
      - run: go vet ./...
      - run: go test ./...
